name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The action's default packages include 'tools', which Google no longer publishes, so sdkmanager fails on it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # Release packaging stops without an upload key (build.gradle.kts). CI signs with a throwaway one;
      # store.ts pins the real certificate, so nothing CI builds can pass for a store build.
      - name: Throwaway signing key for release packaging
        run: |
          dir="$RUNNER_TEMP/signing"; mkdir -p "$dir"; pass="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$dir/ci.jks" -storetype PKCS12 -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=CI throwaway' -storepass "$pass" -keypass "$pass"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=ci\nkeyPassword=%s\n' "$dir/ci.jks" "$pass" "$pass" > "$dir/ci.properties"
          echo "POLYCAP_ANDROID_SIGNING=$dir/ci.properties" >> "$GITHUB_ENV"
      - name: Build, unit-test and lint both platform flavors
        working-directory: app/android
        run: ./gradlew testQuestDebugUnitTest testAndroidXrDebugUnitTest assembleQuestDebug assembleAndroidXrDebug assembleQuestRelease assembleAndroidXrRelease lintQuestDebug lintAndroidXrDebug lintQuestRelease lintAndroidXrRelease
      - run: python3 app/tools/verify-manifests.py
      - run: python3 app/tools/verify-manifests.py release
