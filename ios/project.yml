# XcodeGen spec for Polydance for iPhone (docs/IPHONE.md). The Xcode project it makes,
# ios/Polydance.xcodeproj, is generated by `npm run ios -- generate` (or any build) and gitignored, so this
# file and App/Info.plist are the only project settings anyone edits. The app's screen is the deck in the
# shared look (PolydanceShared, from ../mac); I0's probe runs under it (ios/README.md).
#
# Signing is automatic with the team given on the command line (DEVELOPMENT_TEAM, which ios/build.sh reads
# from POLYCAP_IOS_TEAM or Xcode's own accounts), so no team id is written here. POLYDANCE_COMMIT is set
# by ios/build.sh to the commit the app is built from and lands in Info.plist as PolydanceCommit.
#
# Since I4 (docs/IPHONE.md) the app embeds a ReplayKit broadcast upload extension, PolydanceBroadcast, which records
# the screen and the microphone. Its code is the Vision Pro's, compiled here unchanged (../visionos/Broadcast,
# ../visionos/Shared and BroadcastLink): one file each, so a fix reaches both. Its Info.plist and the entitlements are
# this platform's own, for the app group group.net.polydance.capture.iphone the two share and nothing else.
name: Polydance
options:
  bundleIdPrefix: net.polydance.capture
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  PolydancePhoneCore:
    path: Core
  # The Mac's package, for its one product built for iOS too: PolydanceShared, the look and the thread models
  # the Mac and the iPhone share (docs/IPHONE.md I1, D7). Its macOS targets are never built here.
  PolydanceCapture:
    path: ../mac
targets:
  Polydance:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      - path: App/Resources
      # The logo, the ballerina, from the headset app's own file rather than a copy (CLAUDE.md).
      - path: ../app/android/app/src/main/res/drawable-nodpi/polydance_mark.png
        buildPhase: resources
      # The screen's takes (I4): the contract with the extension and the app's side of it, the Vision Pro's files.
      - path: ../visionos/Shared/Broadcast.swift
      - path: ../visionos/App/Sources/BroadcastLink.swift
    dependencies:
      - package: PolydancePhoneCore
        product: PolydancePhoneCore
      - package: PolydanceCapture
        product: PolydanceShared
      - target: PolydanceBroadcast
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Polydance
        PRODUCT_BUNDLE_IDENTIFIER: net.polydance.capture.iphone
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Polydance.entitlements
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        POLYDANCE_COMMIT: unknown
        # The app's AVFoundation and UIKit code is written in Swift 5 mode, as mac/ does; the core
        # package (ios/Core) is Swift 6 strict.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_PREVIEWS: NO
  PolydanceBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ../visionos/Broadcast/SampleHandler.swift
      - path: ../visionos/Shared/Broadcast.swift
    dependencies:
      - package: PolydancePhoneCore
        product: PolydancePhoneCore
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_NAME: PolydanceBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: net.polydance.capture.iphone.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Broadcast/PolydanceBroadcast.entitlements
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        POLYDANCE_COMMIT: unknown
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES
schemes:
  Polydance:
    build:
      targets:
        Polydance: all
        PolydanceBroadcast: all
    run:
      config: Debug
    archive:
      config: Release
